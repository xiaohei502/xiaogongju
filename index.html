<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小工具库</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="library-shell">
      <header class="library-header">
        <h1>小工具库</h1>
        <p>选择一个工具，开始处理文本和写作内容。</p>
      </header>

      <section class="filters" aria-label="工具筛选">
        <label>
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="搜索工具..." autocomplete="off" />
        </label>
        <label>
          <span>分类</span>
          <select id="categoryFilter">
            <option value="all">全部分类</option>
          </select>
        </label>
        <label>
          <span>状态</span>
          <select id="statusFilter">
            <option value="all">全部状态</option>
            <option value="available">可用</option>
            <option value="planned">规划中</option>
          </select>
        </label>
      </section>

      <section aria-labelledby="toolsTitle">
        <div class="section-title">
          <h2 id="toolsTitle">工具</h2>
          <p id="resultSummary" aria-live="polite">正在加载...</p>
        </div>
        <div id="toolGrid" class="tool-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>没有找到匹配的工具。</div>
      </section>
    </main>

    <script src="assets/app.js" defer></script>
  </body>
</html>
